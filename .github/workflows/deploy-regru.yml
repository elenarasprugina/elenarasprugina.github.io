# Пересылка главной страницы на хостинг REG.RU (с 11.2026; Beget взломан 02.11 и больше не используется).
# После каждого изменения в main файлы этого репозитория копируются в корень сайта 13mirrors.ru.
# Папку vitrina/ (её пересылает репозиторий vitrina) эта пересылка НИКОГДА не трогает:
# в корне сайта ничего не удаляется — каждая папка репозитория (assets, grimoire…)
# обновляется только внутри себя, а отдельные файлы (index.html, favicon.svg) просто перезаписываются.
# Вход — отдельный FTP-аккаунт REG.RU, у которого домашняя папка = папка сайта (www/13mirrors.ru),
# а не весь хостинг. Соединение шифрованное (FTP + TLS), пароль в журнал не выводится.
# Нужно в Settings → Secrets and variables → Actions:
#   Secrets   → REGRU_PASSWORD — пароль этого FTP-аккаунта (u3722421_github, папка /www/13mirrors.ru/).
# В папке сайта на REG.RU должен лежать пустой файл-метка .13mirrors-deploy-root.
name: Пересылка на REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:        # кнопка «Run workflow» — запустить вручную

concurrency:
  group: regru-home
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGRU_HOST: server162.hosting.reg.ru   # сервер хостинга «Хост-0» u3722421
  REGRU_USER: u3722421_github           # FTP-аккаунт только на папку сайта (создан 12.11.2026)
  MARKER: .13mirrors-deploy-root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка
        env:
          LFTP_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Нет пароля: добавьте REGRU_PASSWORD в Settings → Secrets and variables → Actions → Secrets. Ничего не скопировано."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      - name: Проверка, что мы в папке сайта
        env:
          LFTP_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
        run: |
          # 1) В папке должен лежать файл-метка .13mirrors-deploy-root — значит, это папка сайта.
          # 2) Не должно быть видно папок уровнем выше (www, 13mirrors.ru, logs, etc).
          # Если что-то не так — останавливаемся, ничего не копируя и не удаляя.
          lftp -c "set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30;
                   set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes;
                   open --env-password -u $REGRU_USER ftp://$REGRU_HOST;
                   pwd; cls -1a" > "$RUNNER_TEMP/list.txt"
          cat "$RUNNER_TEMP/list.txt"
          if ! grep -qxF "$MARKER" "$RUNNER_TEMP/list.txt"; then
            echo "::error::В папке на REG.RU нет файла-метки $MARKER. Пересылка остановлена, ничего не изменено."
            exit 1
          fi
          if grep -qE '^(www|13mirrors\.ru|logs|etc|tmp)/?$' "$RUNNER_TEMP/list.txt"; then
            echo "::error::Аккаунт открывает не папку сайта, а уровень выше. Пересылка остановлена, ничего не изменено."
            exit 1
          fi

      - name: Пересылка главной (без vitrina/)
        env:
          LFTP_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
        run: |
          # Список команд собирается из того, что лежит в репозитории (скрытые .git и .github
          # в него не попадают; других скрытых файлов в репозитории нет).
          # vitrina, README.md, CNAME, CLAUDE.md пропускаются.
          # Для папок — mirror --delete ВНУТРИ этой папки, для файлов — put (перезапись).
          # Команды «удалить что-то в корне сайта» здесь нет вообще.
          cmds=""
          for item in *; do
            case "$item" in
              vitrina|README.md|CNAME|CLAUDE.md) echo "пропускаю: $item"; continue ;;
            esac
            if [ -d "$item" ]; then
              cmds="$cmds mirror --reverse --delete --parallel=4 --no-perms --verbose=1 \"$item\" \"$item\";"
            else
              cmds="$cmds put \"$item\";"
            fi
          done
          echo "Команды: $cmds"
          # Каждый файл сначала загружается целиком под временным именем (.up-…) и потом одним движением
          # встаёт на место — кто открыл сайт в эту минуту, не получит обрезанный файл.
          # Если сервер не даст заменить файл переименованием — запасной путь: прямо на месте (с предупреждением).
          send() {
            lftp -c "set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30; $1
                     set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes;
                     open --env-password -u $REGRU_USER ftp://$REGRU_HOST;
                     $cmds"
          }
          if ! send "set xfer:use-temp-file yes; set xfer:temp-file-name .up-*;"; then
            echo "::warning::Не получилось заменить файлы через временные — пересылаю прямо на месте."
            send ""
          fi
